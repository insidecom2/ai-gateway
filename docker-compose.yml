services:
  ollama-auth-proxy:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}
      PROXY_URL: ${PROXY_URL:-http://127.0.0.1:8000}
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      MODEL_GEMMA_CELESTIAL: ${MODEL_GEMMA_CELESTIAL:-qwen2.5:3b}
      MODEL_GEMMA_CODE_PRO: ${MODEL_GEMMA_CODE_PRO:-qwen2.5:3b}
      MODEL_GEMMA4_CLOUD: ${MODEL_GEMMA4_CLOUD:-qwen2.5:3b}
      HOST: 0.0.0.0
      PORT: 8000
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
    extra_hosts:
      - "host.docker.internal:host-gateway"
