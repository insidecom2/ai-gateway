services:
  ollama-auth-proxy:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}
      HOST: 0.0.0.0
      PORT: 8000
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
    extra_hosts:
      - "host.docker.internal:host-gateway"
